# One independent learning program. All subject matter lives here and
# nowhere else in the repository.
title: Learning program definition
type: object
required:
  - schema_version
  - id
  - title
  - goal
  - created
  - status
  - competencies
  - mastery_policy
  - lesson_policy
additionalProperties: false
$defs:
  id:
    type: string
    pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
    maxLength: 48
properties:
  schema_version:
    const: 1
  id:
    $ref: '#/$defs/id'
  title:
    type: string
    minLength: 1
    maxLength: 120
  goal:
    type: string
    minLength: 1
    maxLength: 1000
  created:
    type: string
    format: date
  status:
    enum: [active, paused, archived]
  competencies:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, title, description, prerequisites]
      additionalProperties: false
      properties:
        id:
          $ref: '#/$defs/id'
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          minLength: 1
          maxLength: 1000
        prerequisites:
          type: array
          uniqueItems: true
          items:
            $ref: '#/$defs/id'
        tags:
          type: array
          uniqueItems: true
          items:
            $ref: '#/$defs/id'
  mastery_policy:
    type: object
    required: [ewma_alpha, proficient_threshold, mastered_threshold, min_evidence]
    additionalProperties: false
    properties:
      ewma_alpha:
        type: number
        exclusiveMinimum: 0
        maximum: 1
        description: Weight of the newest score in the running mastery estimate.
      proficient_threshold:
        type: number
        minimum: 0
        maximum: 1
      mastered_threshold:
        type: number
        minimum: 0
        maximum: 1
      min_evidence:
        type: integer
        minimum: 1
        description: Assessment events required before proficient/mastered can be awarded.
  lesson_policy:
    type: object
    required: [target_minutes, history_lessons_in_context, review_after_days]
    additionalProperties: false
    properties:
      target_minutes:
        type: integer
        minimum: 5
        maximum: 240
      history_lessons_in_context:
        type: integer
        minimum: 0
        maximum: 3
        description: How many previous lesson handoffs the context pack may include.
      review_after_days:
        type: integer
        minimum: 1
        maximum: 365
