# One independent learning program. All subject matter lives here and
# nowhere else in the repository.
title: Learning program definition
type: object
required:
  - schema_version
  - id
  - title
  - goal
  - created
  - status
  - competencies
  - mastery_policy
  - lesson_policy
additionalProperties: false
"$defs":
  id:
    type: string
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    maxLength: 48
  texts:
    type: array
    uniqueItems: true
    items:
      type: string
      minLength: 1
      maxLength: 1000
properties:
  schema_version:
    const: 1
  id:
    "$ref": "#/$defs/id"
  title:
    type: string
    minLength: 1
    maxLength: 120
  goal:
    type: string
    minLength: 1
    maxLength: 1000
  created:
    type: string
    format: date
  status:
    enum:
      - active
      - paused
      - archived
  competencies:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - id
        - title
        - description
        - prerequisites
      additionalProperties: false
      properties:
        id:
          "$ref": "#/$defs/id"
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          minLength: 1
          maxLength: 1000
        prerequisites:
          type: array
          uniqueItems: true
          items:
            "$ref": "#/$defs/id"
        tags:
          type: array
          uniqueItems: true
          items:
            "$ref": "#/$defs/id"
  mastery_policy:
    type: object
    required:
      - ewma_alpha
      - proficient_threshold
      - mastered_threshold
      - min_evidence
    additionalProperties: false
    properties:
      ewma_alpha:
        type: number
        exclusiveMinimum: 0
        maximum: 1
        description: Weight of the newest score in the running mastery estimate.
      proficient_threshold:
        type: number
        minimum: 0
        maximum: 1
      mastered_threshold:
        type: number
        minimum: 0
        maximum: 1
      min_evidence:
        type: integer
        minimum: 1
        description: Assessment events required before proficient/mastered can be awarded.
  lesson_policy:
    type: object
    required:
      - target_minutes
      - history_lessons_in_context
      - review_after_days
    additionalProperties: false
    properties:
      target_minutes:
        type: integer
        minimum: 5
        maximum: 240
      history_lessons_in_context:
        type: integer
        minimum: 0
        maximum: 3
        description: How many previous lesson handoffs the context pack may include.
      context_max_chars:
        type: integer
        minimum: 2000
        maximum: 100000
        description: Optional size budget for the lesson context pack (default 16000). `context --max-chars` overrides it.
      review_after_days:
        type: integer
        minimum: 1
        maximum: 365
  curriculum:
    type: object
    additionalProperties: false
    description: Pointer to the approved curriculum revision that produced `competencies`. Written only by `curriculum activate`.
    required:
      - revision
      - activated
      - snapshot
    properties:
      revision:
        type: integer
        minimum: 1
      activated:
        type: string
        format: date
      snapshot:
        type: string
        minLength: 1
        maxLength: 200
  spec:
    type: object
    additionalProperties: false
    description: Approved onboarding specification. Present only for programs created via onboarding.
    required:
      - goal
      - profile
      - constraints
      - assumptions
      - open_questions
      - approval
    properties:
      goal:
        type: object
        additionalProperties: false
        properties:
          statement:
            type: string
            minLength: 1
            maxLength: 1000
          motivation:
            type: string
            minLength: 1
            maxLength: 1000
          applications:
            "$ref": "#/$defs/texts"
          competency_outcomes:
            "$ref": "#/$defs/texts"
          practical_outcomes:
            "$ref": "#/$defs/texts"
          success_criteria:
            "$ref": "#/$defs/texts"
      profile:
        type: object
        additionalProperties: false
        properties:
          prior_experience:
            "$ref": "#/$defs/texts"
          knowledge_gaps:
            "$ref": "#/$defs/texts"
          diagnostics:
            type: array
            items:
              type: object
              required:
                - prompt
                - outcome
              additionalProperties: false
              properties:
                prompt:
                  type: string
                  minLength: 1
                  maxLength: 1000
                outcome:
                  type: string
                  minLength: 1
                  maxLength: 1000
                assisted:
                  type: boolean
      constraints:
        type: object
        additionalProperties: false
        properties:
          hours_per_week:
            type: number
            exclusiveMinimum: 0
            maximum: 100
          session_minutes:
            type: integer
            minimum: 5
            maximum: 240
          depth:
            enum:
              - overview
              - working
              - deep
              - expert
          pace:
            enum:
              - relaxed
              - steady
              - intensive
          deadline:
            type: string
            pattern: "^(none|\\d{4}-\\d{2}-\\d{2})$"
            description: "A YYYY-MM-DD date, or the word none."
          preferred_methods:
            "$ref": "#/$defs/texts"
          other:
            "$ref": "#/$defs/texts"
      assumptions:
        "$ref": "#/$defs/texts"
      open_questions:
        type: array
        items:
          type: object
          required:
            - id
            - text
            - blocking
          additionalProperties: false
          properties:
            id:
              "$ref": "#/$defs/id"
            text:
              type: string
              minLength: 1
              maxLength: 1000
            blocking:
              type: boolean
            answer:
              type: string
              minLength: 1
              maxLength: 1000
      approval:
        type: object
        required:
          - revision
          - date
          - statement
        additionalProperties: false
        properties:
          revision:
            type: integer
            minimum: 1
          date:
            type: string
            format: date
          statement:
            type: string
            minLength: 1
            maxLength: 1000
