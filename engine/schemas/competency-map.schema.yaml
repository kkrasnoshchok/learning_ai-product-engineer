# Domain-wide competency map (programs/<id>/design/competencies.yaml).
# Derived from research evidence only; says nothing about any particular learner.
title: Competency map
type: object
required: [schema_version, id, revision, created, competencies]
additionalProperties: false
"$defs":
  id:
    type: string
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    maxLength: 48
  text:
    type: string
    minLength: 1
    maxLength: 1000
  ids:
    type: array
    uniqueItems: true
    items:
      "$ref": "#/$defs/id"
properties:
  schema_version:
    const: 1
  id:
    "$ref": "#/$defs/id"
  revision:
    type: integer
    minimum: 1
  created:
    type: string
    format: date
  competencies:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, name, description, objectives, prerequisites, priority, level, sources, assessment_criteria, applications]
      additionalProperties: false
      properties:
        id:
          "$ref": "#/$defs/id"
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          "$ref": "#/$defs/text"
        objectives:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, text]
            additionalProperties: false
            properties:
              id:
                "$ref": "#/$defs/id"
              text:
                "$ref": "#/$defs/text"
        prerequisites:
          "$ref": "#/$defs/ids"
        priority:
          enum: [core, important, supplementary]
        level:
          enum: [introductory, working, proficient, expert]
        sources:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            "$ref": "#/$defs/id"
        assessment_criteria:
          type: array
          minItems: 1
          items:
            type: object
            required: [objective, criterion]
            additionalProperties: false
            properties:
              objective:
                "$ref": "#/$defs/id"
              criterion:
                "$ref": "#/$defs/text"
        applications:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            "$ref": "#/$defs/text"
